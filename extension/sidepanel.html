<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <script src="theme.js"></script>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --bar: rgba(245, 245, 247, 0.72);
        --text: #1d1d1f;
        --muted: #86868b;
        --line: rgba(0, 0, 0, 0.08);
        --blue: #0071e3;
        --blue-hover: #0077ed;
        --error: #e30000;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #000000;
          --card: #1c1c1e;
          --bar: rgba(22, 22, 23, 0.72);
          --text: #f5f5f7;
          --muted: #86868b;
          --line: rgba(255, 255, 255, 0.1);
          --blue: #0a84ff;
          --blue-hover: #409cff;
          --error: #ff453a;
          --shadow: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #000000;
        --card: #1c1c1e;
        --bar: rgba(22, 22, 23, 0.72);
        --text: #f5f5f7;
        --muted: #86868b;
        --line: rgba(255, 255, 255, 0.1);
        --blue: #0a84ff;
        --blue-hover: #409cff;
        --error: #ff453a;
        --shadow: none;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        letter-spacing: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      /* Frosted top bar */
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 20px;
        background: var(--bar);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.022em;
      }
      .mark {
        width: 22px;
        height: 22px;
      }
      #theme {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        transition: color 0.2s;
      }
      #theme:hover {
        color: var(--text);
      }
      .to-light,
      :root[data-resolved="dark"] .to-dark {
        display: none;
      }
      :root[data-resolved="dark"] .to-light {
        display: block;
      }

      /* Current page card */
      .page {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 16px 0;
        padding: 16px 16px 16px 20px;
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .page-info {
        flex: 1;
        min-width: 0;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0;
      }
      #status {
        display: block;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.022em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      [data-state="idle"] #status,
      [data-state="loading"] #status {
        color: var(--muted);
      }
      [data-state="error"] #status {
        color: var(--error);
        font-size: 15px;
      }
      .pill {
        padding: 8px 16px;
        border: 0;
        border-radius: 980px;
        background: var(--blue);
        color: #fff;
        font-size: 14px;
        white-space: nowrap;
        transition: background 0.2s;
      }
      .pill:not(:disabled):hover {
        background: var(--blue-hover);
      }

      /* Conversation */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .note {
        margin: auto 8px;
        text-align: center;
        font-size: 15px;
        color: var(--muted);
      }
      .hero {
        margin: auto 8px;
        text-align: center;
        animation: in 0.5s ease-out;
      }
      .hero h2 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.14;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .hero p {
        margin: 0;
        font-size: 17px;
        color: var(--muted);
        letter-spacing: -0.022em;
      }
      .msg {
        max-width: 86%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        animation: in 0.3s ease-out;
      }
      .user {
        align-self: flex-end;
        padding: 9px 15px;
        border-radius: 20px;
        background: var(--blue);
        color: #fff;
      }
      .bot {
        align-self: flex-start;
        padding: 14px 18px;
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .pending {
        color: var(--muted);
      }
      .error {
        color: var(--error);
      }
      .sources {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0;
        white-space: normal;
      }
      .sources span + span::before {
        content: " · ";
      }

      /* Frosted composer */
      .composer {
        padding: 12px 16px 16px;
        background: var(--bar);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-top: 1px solid var(--line);
      }
      form {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 4px 16px;
        border: 1px solid var(--line);
        border-radius: 980px;
        background: var(--card);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      form:focus-within {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent);
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 7px 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        letter-spacing: inherit;
      }
      input::placeholder {
        color: var(--muted);
      }
      #send {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <mask id="mark-cut">
            <path fill="#fff" d="M32 6C17 6 5 16 5 29c0 7 3.6 13.3 9.4 17.6L12 58l12.5-6.3c2.4.6 4.9.9 7.5.9 15 0 27-10 27-23.5S47 6 32 6z" />
            <g fill="#000">
              <rect x="17" y="25" width="4" height="8" rx="2" />
              <rect x="23.5" y="21" width="4" height="16" rx="2" />
              <rect x="30" y="17" width="4" height="24" rx="2" />
              <rect x="36.5" y="22" width="4" height="14" rx="2" />
              <rect x="43" y="25" width="4" height="8" rx="2" />
            </g>
          </mask>
          <rect width="64" height="64" fill="currentColor" mask="url(#mark-cut)" />
        </svg>
        WebWhisper
      </h1>
      <button id="theme" type="button" title="Switch theme" aria-label="Switch theme">
        <svg class="to-dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="to-light" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </header>

    <div class="page" id="page" data-state="idle">
      <div class="page-info">
        <div class="eyebrow">Current page</div>
        <span id="status">Not analyzed</span>
      </div>
      <button id="analyze" class="pill">Analyze</button>
    </div>

    <div id="messages">
      <div class="hero note">
        <h2>Ask this page anything.</h2>
        <p>Analyze it first. Then just ask.</p>
      </div>
    </div>

    <div class="composer">
      <form id="ask">
        <input id="question" placeholder="Ask about this page" autocomplete="off" disabled />
        <button id="send" class="pill" aria-label="Send" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
        </button>
      </form>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
